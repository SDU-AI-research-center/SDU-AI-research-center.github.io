<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SDU University AI research center webpage""
    />
    <title>AI research center</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Arial,
          Helvetica,
          sans-serif;
        color: #171717;
        background: #fafafa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
      }

      main {
        width: min(100% - 3rem, 720px);
        min-height: 100vh;
        margin-inline: auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-block: 4rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 6rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      p {
        max-width: 600px;
        margin: 2rem 0 0;
        font-size: clamp(1.1rem, 2.5vw, 1.4rem);
        line-height: 1.6;
      }

      .soon {
        margin-top: 4rem;
        color: #555;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello!</h1>
      <p>
        SDU University AI research center webpage
      </p>
      <p class="soon">More coming soon.</p>
    </main>
  </body>
</html>
